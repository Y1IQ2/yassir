<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="مصروفاتي">
<meta name="theme-color" content="#0a0e1a">
<title>مصروفاتي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#0a0e1a;--bg2:#0f1528;--card:#141d35;--card2:#1a2540;
  --gold:#f0c040;--golddim:rgba(240,192,64,0.12);
  --green:#26d97f;--red:#ff5b5b;--amber:#f59e0b;
  --text:#e8eeff;--muted:#5a7090;--border:rgba(255,255,255,0.07);
}
body{font-family:'Cairo',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;max-width:430px;margin:0 auto;overflow-x:hidden}
.header{padding:52px 20px 16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:100;background:linear-gradient(to bottom,var(--bg) 80%,transparent)}
.header-title{font-size:22px;font-weight:900;color:var(--gold)}
.header-sub{font-size:12px;color:var(--muted)}
.salary-card{margin:0 16px 16px;background:linear-gradient(135deg,var(--card2),var(--card));border-radius:24px;padding:24px;border:1px solid rgba(240,192,64,0.2);position:relative;overflow:hidden;cursor:pointer;transition:transform 0.15s}
.salary-card:active{transform:scale(0.98)}
.salary-card::before{content:'';position:absolute;top:-40px;left:-40px;width:160px;height:160px;background:radial-gradient(circle,rgba(240,192,64,0.15),transparent 70%);pointer-events:none}
.salary-label{font-size:13px;color:var(--muted);margin-bottom:6px}
.salary-amount{font-size:34px;font-weight:900;color:var(--gold);direction:ltr;text-align:right}
.salary-hint{font-size:11px;color:var(--muted);margin-top:8px}
.summary-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:0 16px 16px}
.sum-card{background:var(--card);border-radius:18px;padding:16px;border:1px solid var(--border)}
.sum-label{font-size:12px;color:var(--muted);margin-bottom:6px}
.sum-amount{font-size:17px;font-weight:700;direction:ltr;text-align:right}
.sum-amount.red{color:var(--red)}.sum-amount.green{color:var(--green)}.sum-amount.amber{color:var(--amber)}
.progress-wrap{margin:0 16px 20px}
.progress-bg{height:8px;background:var(--card2);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;border-radius:99px;transition:width 0.6s cubic-bezier(.4,0,.2,1)}
.progress-meta{display:flex;justify-content:space-between;margin-top:6px;font-size:11px;color:var(--muted)}
.section-header{display:flex;justify-content:space-between;align-items:center;margin:0 16px 12px}
.section-title{font-size:17px;font-weight:700}
.add-btn{background:var(--gold);color:#0a0e1a;border:none;border-radius:20px;padding:8px 18px;font-size:13px;font-weight:700;font-family:'Cairo',sans-serif;cursor:pointer;transition:transform 0.15s}
.add-btn:active{transform:scale(0.95)}
.expense-list{padding:0 16px;display:flex;flex-direction:column;gap:10px;padding-bottom:100px}
.expense-item{background:var(--card);border-radius:18px;padding:14px 16px;display:flex;align-items:center;gap:12px;border:1px solid var(--border);animation:slideIn 0.3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.exp-icon{width:46px;height:46px;border-radius:14px;background:var(--bg2);display:flex;align-items:center;justify-content:center;font-size:22px;flex-shrink:0}
.exp-info{flex:1;min-width:0}
.exp-name{font-size:15px;font-weight:600}
.exp-amount{font-size:13px;color:var(--gold);margin-top:3px}
.exp-actions{display:flex;gap:8px;flex-shrink:0}
.icon-btn{width:34px;height:34px;border-radius:10px;border:none;background:var(--bg2);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:transform 0.15s}
.icon-btn:active{transform:scale(0.9)}
.icon-btn.del{background:rgba(255,91,91,0.12)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.75);z-index:200;display:flex;align-items:flex-end;opacity:0;pointer-events:none;transition:opacity 0.25s;backdrop-filter:blur(4px)}
.overlay.open{opacity:1;pointer-events:all}
.modal{background:var(--bg2);border-radius:28px 28px 0 0;padding:24px 20px 44px;width:100%;transform:translateY(100%);transition:transform 0.3s cubic-bezier(.4,0,.2,1);border-top:1px solid var(--border)}
.overlay.open .modal{transform:translateY(0)}
.modal-handle{width:40px;height:4px;background:var(--border);border-radius:99px;margin:0 auto 16px}
.modal-title{font-size:20px;font-weight:800;color:var(--gold);text-align:center;margin-bottom:20px}
.field-label{font-size:13px;color:var(--muted);margin-bottom:6px;margin-top:14px}
.field-input{width:100%;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 16px;color:var(--text);font-size:16px;font-family:'Cairo',sans-serif;outline:none;text-align:right;transition:border-color 0.2s}
.field-input:focus{border-color:var(--gold)}
.icon-picker{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.icon-picker::-webkit-scrollbar{display:none}
.icon-opt{width:44px;height:44px;border-radius:12px;background:var(--card);border:1.5px solid var(--border);font-size:20px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:border-color 0.15s,background 0.15s}
.icon-opt.selected{border-color:var(--gold);background:rgba(240,192,64,0.15)}
.modal-btns{display:flex;gap:10px;margin-top:22px}
.btn-cancel{flex:1;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:15px;color:var(--muted);font-size:15px;font-weight:600;font-family:'Cairo',sans-serif;cursor:pointer}
.btn-save{flex:1;background:var(--gold);border:none;border-radius:14px;padding:15px;color:#0a0e1a;font-size:15px;font-weight:800;font-family:'Cairo',sans-serif;cursor:pointer;transition:transform 0.15s}
.btn-save:active{transform:scale(0.97)}
.empty{text-align:center;padding:40px 20px;color:var(--muted);font-size:14px}
.empty-icon{font-size:48px;margin-bottom:12px}
.toast{position:fixed;bottom:30px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--green);color:#0a0e1a;padding:10px 24px;border-radius:99px;font-size:14px;font-weight:700;opacity:0;transition:all 0.3s;z-index:500;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.install-banner{margin:0 16px 16px;background:var(--golddim);border:1px solid rgba(240,192,64,0.3);border-radius:16px;padding:12px 14px;display:flex;align-items:center;gap:10px;font-size:12px;color:var(--gold)}
.install-x{margin-right:auto;cursor:pointer;font-size:16px;color:var(--muted);flex-shrink:0}
</style>
</head>
<body>

<div class="header">
  <div><div class="header-title">مصروفاتي 💰</div><div class="header-sub">الدينار العراقي</div></div>
</div>

<div class="install-banner" id="ib">
  <span>📲</span>
  <span>افتح بالسفاري ← Share ← Add to Home Screen</span>
  <span class="install-x" onclick="document.getElementById('ib').remove()">✕</span>
</div>

<div class="salary-card" onclick="openSalary()">
  <div class="salary-label">الراتب الشهري</div>
  <div class="salary-amount" id="salaryDisplay">0 د.ع</div>
  <div class="salary-hint">✏️ اضغط لتعديل الراتب</div>
</div>

<div class="summary-row">
  <div class="sum-card"><div class="sum-label">📤 المصاريف</div><div class="sum-amount red" id="totalDisplay">0 د.ع</div></div>
  <div class="sum-card"><div class="sum-label">💚 المتبقي</div><div class="sum-amount green" id="remainDisplay">0 د.ع</div></div>
</div>

<div class="progress-wrap">
  <div class="progress-bg"><div class="progress-fill" id="progressFill" style="width:0%;background:var(--green)"></div></div>
  <div class="progress-meta"><span id="progressPct">0% من الراتب</span><span id="progressItems">0 مصرف</span></div>
</div>

<div class="section-header">
  <div class="section-title">قائمة المصاريف</div>
  <button class="add-btn" onclick="openAdd()">+ إضافة</button>
</div>

<div class="expense-list" id="expenseList"></div>

<div class="overlay" id="salaryOverlay" onclick="if(event.target===this)closeSalary()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">تعديل الراتب</div>
    <div class="field-label">المبلغ بالدينار العراقي</div>
    <input class="field-input" id="salaryInput" type="number" placeholder="مثال: 500000" inputmode="numeric">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeSalary()">إلغاء</button>
      <button class="btn-save" onclick="saveSalary()">حفظ ✅</button>
    </div>
  </div>
</div>

<div class="overlay" id="expOverlay" onclick="if(event.target===this)closeExp()">
  <div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalTitle">إضافة مصرف</div>
    <div class="field-label">اختر أيقونة</div>
    <div class="icon-picker" id="iconPicker"></div>
    <div class="field-label">اسم المصرف</div>
    <input class="field-input" id="expName" type="text" placeholder="مثال: بنزين، سلفة...">
    <div class="field-label">المبلغ (دينار عراقي)</div>
    <input class="field-input" id="expAmount" type="number" placeholder="مثال: 50000" inputmode="numeric">
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeExp()">إلغاء</button>
      <button class="btn-save" id="modalSaveBtn" onclick="saveExp()">إضافة</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const ICONS=['⛽','💳','🍬','🚬','🍽️','⚡','📶','🛍️','💊','🚗','📱','🎮','☕','🏋️','✈️','🎁','🏠','📚','💇','🧴','🍺','🎯','🔧','🎪','💈'];
let salary=0,expenses=[],editId=null,selectedIcon='💰';
const DEF=[
  {id:'1',name:'بنزين',amount:50000,icon:'⛽'},
  {id:'2',name:'سلفة',amount:100000,icon:'💳'},
  {id:'3',name:'حلويات',amount:20000,icon:'🍬'},
  {id:'4',name:'تدخين',amount:30000,icon:'🚬'},
  {id:'5',name:'أكل برا',amount:80000,icon:'🍽️'},
  {id:'6',name:'كهرباء',amount:50000,icon:'⚡'},
  {id:'7',name:'إنترنت',amount:25000,icon:'📶'},
];
const fmt=n=>n.toLocaleString('ar-IQ')+' د.ع';
const save=()=>{localStorage.setItem('sal',salary);localStorage.setItem('exp',JSON.stringify(expenses))};
const load=()=>{const s=localStorage.getItem('sal');const e=localStorage.getItem('exp');salary=s?+s:0;expenses=e?JSON.parse(e):[...DEF]};
function render(){
  const total=expenses.reduce((s,e)=>s+e.amount,0);
  const rem=salary-total;
  const pct=salary>0?Math.min(Math.round(total/salary*100),100):0;
  const col=pct>90?'var(--red)':pct>70?'var(--amber)':'var(--green)';
  document.getElementById('salaryDisplay').textContent=fmt(salary);
  document.getElementById('totalDisplay').textContent=fmt(total);
  document.getElementById('remainDisplay').textContent=fmt(Math.abs(rem));
  document.getElementById('remainDisplay').className='sum-amount '+(rem>=0?'green':'red');
  const pf=document.getElementById('progressFill');pf.style.width=pct+'%';pf.style.background=col;
  document.getElementById('progressPct').textContent=pct+'% من الراتب';
  document.getElementById('progressItems').textContent=expenses.length+' مصرف';
  const list=document.getElementById('expenseList');
  if(!expenses.length){list.innerHTML='<div class="empty"><div class="empty-icon">📭</div>ما أكو مصاريف<br>اضغط + إضافة للبدء</div>';return}
  list.innerHTML=expenses.map(e=>`<div class="expense-item"><div class="exp-icon">${e.icon}</div><div class="exp-info"><div class="exp-name">${e.name}</div><div class="exp-amount">${fmt(e.amount)}</div></div><div class="exp-actions"><button class="icon-btn" onclick="openEdit('${e.id}')">✏️</button><button class="icon-btn del" onclick="delExp('${e.id}')">🗑️</button></div></div>`).join('');
}
function buildIcons(){document.getElementById('iconPicker').innerHTML=ICONS.map(ic=>`<div class="icon-opt${ic===selectedIcon?' selected':''}" onclick="selIcon('${ic}')">${ic}</div>`).join('')}
function selIcon(ic){selectedIcon=ic;document.querySelectorAll('.icon-opt').forEach(el=>el.classList.toggle('selected',el.textContent===ic))}
function openSalary(){document.getElementById('salaryInput').value=salary||'';document.getElementById('salaryOverlay').classList.add('open');setTimeout(()=>document.getElementById('salaryInput').focus(),300)}
function closeSalary(){document.getElementById('salaryOverlay').classList.remove('open')}
function saveSalary(){salary=+document.getElementById('salaryInput').value||0;save();render();closeSalary();toast('تم حفظ الراتب ✅')}
function openAdd(){editId=null;selectedIcon='💰';document.getElementById('modalTitle').textContent='إضافة مصرف';document.getElementById('modalSaveBtn').textContent='إضافة';document.getElementById('expName').value='';document.getElementById('expAmount').value='';buildIcons();document.getElementById('expOverlay').classList.add('open');setTimeout(()=>document.getElementById('expName').focus(),300)}
function openEdit(id){const e=expenses.find(x=>x.id===id);if(!e)return;editId=id;selectedIcon=e.icon;document.getElementById('modalTitle').textContent='تعديل المصرف';document.getElementById('modalSaveBtn').textContent='حفظ';document.getElementById('expName').value=e.name;document.getElementById('expAmount').value=e.amount;buildIcons();document.getElementById('expOverlay').classList.add('open')}
function closeExp(){document.getElementById('expOverlay').classList.remove('open')}
function saveExp(){
  const name=document.getElementById('expName').value.trim();
  const amount=+document.getElementById('expAmount').value||0;
  if(!name){shake('expName');return}if(!amount){shake('expAmount');return}
  if(editId){expenses=expenses.map(e=>e.id===editId?{...e,name,amount,icon:selectedIcon}:e);toast('تم التعديل ✅')}
  else{expenses.push({id:Date.now()+'',name,amount,icon:selectedIcon});toast('تمت الإضافة ✅')}
  save();render();closeExp();
}
function delExp(id){if(!confirm('تريد تحذف هذا المصرف؟'))return;expenses=expenses.filter(e=>e.id!==id);save();render();toast('تم الحذف 🗑️')}
function shake(id){const el=document.getElementById(id);el.style.borderColor='var(--red)';el.animate([{transform:'translateX(-6px)'},{transform:'translateX(6px)'},{transform:'translateX(0)'}],{duration:200});setTimeout(()=>el.style.borderColor='',1000)}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
document.addEventListener('keydown',e=>{if(e.key==='Enter'){if(document.getElementById('salaryOverlay').classList.contains('open'))saveSalary();if(document.getElementById('expOverlay').classList.contains('open'))saveExp()}});
load();render();
</script>
</body>
</html>
